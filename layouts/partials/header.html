<header>
	<div class="site-identity">
		<a class="site-title" href="{{ .Site.BaseURL }}">
			<h1>{{ .Site.Title }}</h1>
		</a>
		{{ with .Site.Params.subtitle }}
		<p class="site-subtitle">{{ . }}</p>
		{{ end }}
	</div>

	{{ if .Site.Menus.main }}
	<nav class="site-nav">
		<ul>
			{{ range .Site.Menus.main }}
			<li><a href="{{ .URL }}">{{ .Name }}</a></li>
			{{ end }}
		</ul>
	</nav>
	{{ end }}
</header>
